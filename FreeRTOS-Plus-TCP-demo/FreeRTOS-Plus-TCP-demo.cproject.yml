# yaml-language-server: $schema=https://raw.githubusercontent.com/Open-CMSIS-Pack/devtools/tools/projmgr/2.12.0/tools/projmgr/schemas/cproject.schema.json
project:
  groups:
    - group: App
      files:
        - file: main.c
        - file: SimpleTCPEchoServer.c
        - file: SimpleUDPEchoServer.c
        - file: NetworkInterfaceCompat.c
    - group: EthDriver
      files:
        - file: ../drv/NetworkInterface.c
        - file: ../drv/phyHandling.c
    - group: FaultHandler
      files:
        - file: ../libs/common_app_utils/fault_handler/fault_handler.c
    - group: RTT
      files:
        - file: ../libs/SEGGER_RTT_V796h/RTT/SEGGER_RTT.c
        - file: ../libs/SEGGER_RTT_V796h/Syscalls/SEGGER_RTT_Syscalls_GCC.c
          for-compiler: GCC
        - file: ../libs/SEGGER_RTT_V796h/Syscalls/SEGGER_RTT_Syscalls_KEIL.c
          for-compiler: AC6
        - file: ../libs/SEGGER_RTT_V796h/Syscalls/SEGGER_RTT_Syscalls_IAR.c
          for-compiler: IAR

  output:
    base-name: $Project$
    type:
      - elf
      - bin

  add-path:
    - include
    - RTE/FreeRTOS
    - RTE/RTOS
    - Config
    - ../libs/common_app_utils/fault_handler
    - ../libs/SEGGER_RTT_V796h/RTT
    - ../libs/SEGGER_RTT_V796h/Config
    - ../drv
    - ../compiler/include

  misc:
    - for-compiler: GCC
      Link:
        # Release the RTL8201 from reset before PHY discovery, and keep the
        # MAC at 100/full if MDIO auto-neg does not set the link mask.
        - -Wl,--wrap=xPhyDiscover
        - -Wl,--wrap=xPhyStartAutoNegotiation
        - -Wl,--wrap=xSendEventStructToIPTask

  # AWS::FreeRTOS-Plus-TCP requires RTOS&FreeRTOS:Core, which the CMSIS-FreeRTOS
  # pack layer provides. The vendored kernel layer used by blinky does not.
  layers:
    - layer: $BoardLayer$
    - layer: $SolutionDir()$/rtos/freertos-cmsis-pack.clayer.yml

  components:
    - component: ARM::CMSIS:CORE
    - component: AlifSemiconductor::Device:Startup
    - component: AlifSemiconductor::Device:SOC Peripherals:PINCONF
    - component: AlifSemiconductor::Device:SOC Peripherals:GPIO
    - component: Device:SOC Peripherals:MHU
    - component: Services:Secure Enclave:core&Source
    - component: Services:Secure Enclave:Initialization Helper&Source
    - component: FreeRTOS:FreeRTOS+ TCP:Core Library
    - component: FreeRTOS:FreeRTOS+ TCP:Buffer Allocation&Buffer Allocation 1
    - component: FreeRTOS:FreeRTOS+ TCP:Compiler Port&GCC
    - component: FreeRTOS:FreeRTOS+ TCP:Network Interface&Custom
